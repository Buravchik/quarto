# Local-only bot/API. Production is Cloud Run + GitHub Pages (Sudoku pattern) — no tunnels.
services:
  bot:
    build: .
    restart: unless-stopped
    ports:
      - "8090:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      # Omit WEBHOOK_URL in .env for local long polling; use a non-prod BOT_TOKEN.
